<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="欢迎来到我的朋友聚集地">
  <meta name="keywords" content="HTML, CSS, JavaScript, TypeScript, Vue, Git...">
  <meta name="theme-color" content="rgb(26, 26, 26)">
  <title></title>
  <link rel="shortcut icon" href="/public/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="<!-- base.css -->">
  <link rel="stylesheet" href="<!-- index.css -->">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <script src="<!-- index.js -->"></script>
</head>

<body>
  <!-- Header -->
  <main class="blog-main">
    <article class="friend-article">
      <div class="friend-grid">
      </div>

      <hr />
      <form class="friend-form" action="" method="post">
        <div class="friend-field">
          <label for="name">输入你的名字：</label>
          <input type="text" id="name" placeholder="测试">
        </div>
        <div class="friend-field">
          <label for="url">输入博客链接：</label>
          <input type="url" id="url" placeholder="https://www.fwqaq.us">
        </div>
        <div class="friend-field">
          <label for="avatar">输入头像链接：</label>
          <input type="url" id="avatar" placeholder="https://avatars.githubusercontent.com/u/286696?v=4">
        </div>
        <div class="friend-field">
          <label for="description">输入你的描述：</label>
          <input type="text" id="description" placeholder="写下你博客的描述">
        </div>
        <div class="friend-field">
          <button class="friend-button" type="submit">提交</button>
        </div>
      </form>
    </article>
  </main>
  <!-- Footer -->
</body>
<script type="module">
  async function main() {
    await getFriends()
    const form = document.querySelector('.friend-form')
    form.addEventListener('submit', (e) => {
      e.preventDefault()
      postFriend()
    })
  }

  async function postFriend() {
    const name = document.getElementById('name').value
    const url = document.getElementById('url').value
    const avatar = document.getElementById('avatar').value
    const description = document.getElementById('description').value
    if (!name || !url) {
      return alert('名字和链接不能为空')
    }

    const res = await fetch("https://friends.fwqaq.us/api/add", {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        name,
        link: url,
        avatar,
        description
      })
    })

    if (res.ok) {
      alert('提交成功')
    } else {
      alert(res.statusText || '提交失败')
    }
  }

  async function getFriends() {
    const res = await fetch("https://friends.fwqaq.us/api/list")
    const data = await res.json()
    const fragment = document.createDocumentFragment();
    const cards = data.forEach(item => {
      const cardElement = document.createElement('a');
      cardElement.classList.add('friend-card');
      cardElement.href = item.url;
      cardElement.target = '_blank';

      const imgElement = document.createElement('img');
      imgElement.src = item.avatar || 'https://avatars.githubusercontent.com/u/286696?v=4';
      imgElement.alt = '头像';

      const contentElement = document.createElement('div');
      contentElement.classList.add('friend-content');

      const h3Element = document.createElement('h3');
      h3Element.textContent = item.name;

      const pElement = document.createElement('p');
      pElement.textContent = item.description || '这个人很懒，什么都没写';

      contentElement.appendChild(h3Element);
      contentElement.appendChild(pElement);

      cardElement.appendChild(imgElement);
      cardElement.appendChild(contentElement);

      fragment.appendChild(cardElement);
    })

    document.querySelector(".friend-grid").append(fragment)
  }
  main()
</script>

</html>
