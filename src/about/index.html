<!DOCTYPE html>
<html lang="zh-CN">

<!-- Head -->

<body>
  <!-- Header -->
  <main class="about-main">
    <div class="about-container">

      <!-- Profile -->
      <section class="about-profile">
        <img class="about-avatar" src="{{profile.avatar}}" alt="{{profile.name}}">
        <div class="about-profile-info">
          <h1 class="about-name">{{profile.name}}</h1>
          <p class="about-tagline">{{profile.tagline}}</p>
          <div class="about-chips">
            <!-- profile.chips -->
          </div>
        </div>
      </section>

      <!-- Quote -->
      <section class="about-quote">
        <blockquote>
          {{profile.quote.text}}
          <cite>— {{profile.quote.cite}}</cite>
        </blockquote>
      </section>

      <!-- Tech Stack -->
      <section class="about-section">
        <h2 class="about-section-title">技术栈</h2>
        <!-- profile.skills -->
      </section>

      <!-- Projects -->
      <section class="about-section">
        <h2 class="about-section-title">项目</h2>
        <div class="projects-grid">
          <!-- profile.projects -->
        </div>
      </section>

    </div>
  </main>
  <!-- Footer -->
</body>

</html>
