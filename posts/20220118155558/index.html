<p>当鼠标一放到矩形框中，就会不停的触发事件 (如果是复杂的回调或者 ajax 的请求就会很频繁的触发事件)</p>
<p>有两种解决方案：防抖和节流</p>
</div>
<h2 id="防抖">防抖<a class="anchor" aria-label="Anchor" aria-hidden="true" data-anchorjs-icon="🔗" href="#防抖"></a></h2>
<blockquote>
<p>防抖的原理就是：尽管触发事件，但是我只触发最后一次事件，且 n 秒内不再触发。总之，就是要等你触发完事件 n 秒内不再触发事件</p>
</blockquote>
<pre class="shiki andromeeda" style="background-color:#23262E;color:#D5CED9" tabindex="0"><code class="language-js"><span class="line"><span style="color:#C74DED">function</span><span style="color:#FFE66D"> debounce</span><span style="color:#D5CED9">(</span><span style="color:#00E8C6">func</span><span style="color:#D5CED9">, </span><span style="color:#00E8C6">wait</span><span style="color:#D5CED9">) {</span></span>
<span class="line"><span style="color:#C74DED">  let</span><span style="color:#00E8C6"> timeout</span><span style="color:#D5CED9">;</span></span>
<span class="line"><span style="color:#C74DED">  return</span><span style="color:#C74DED"> function</span><span style="color:#D5CED9"> () {</span></span>
<span class="line"><span style="color:#FFE66D">    clearTimeout</span><span style="color:#D5CED9">(</span><span style="color:#00E8C6">timeout</span><span style="color:#D5CED9">);</span></span>
<span class="line"><span style="color:#00E8C6">    timeout</span><span style="color:#EE5D43"> =</span><span style="color:#FFE66D"> setTimeout</span><span style="color:#D5CED9">(() </span><span style="color:#C74DED">=></span><span style="color:#D5CED9"> {</span></span>
<span class="line"><span style="color:#FFE66D">      func</span><span style="color:#D5CED9">();</span></span>
<span class="line"><span style="color:#D5CED9">    }, </span><span style="color:#00E8C6">wait</span><span style="color:#D5CED9">);</span></span>
<span class="line"><span style="color:#D5CED9">  };</span></span>
<span class="line"><span style="color:#D5CED9">}</span></span>
<span class="line"><span style="color:#F39C12">divContainer</span><span style="color:#D5CED9">.</span><span style="color:#00E8C6">onmousemove</span><span style="color:#EE5D43"> =</span><span style="color:#FFE66D"> debounce</span><span style="color:#D5CED9">(</span><span style="color:#00E8C6">getUserAction</span><span style="color:#D5CED9">, </span><span style="color:#F39C12">1000</span><span style="color:#D5CED9">);</span></span>
<span class="line"></span></code></pre>
<ul class="remark-unordered-list">
<li>注意：
<ul class="remark-ordered-list">
<li>setTimeout 中建议使用箭头函数，会指向函数外的 this(这个 this 就是调用这个事件的 id 为 container 的 div)</li>
<li>如果使用普通的函数，会指向 setTimeout 内部设定好的 this，即 window</li>
<li>timeout 在外部初始化，<code>clearTimeout</code>会清理上一次的定时器</li>
</ul>
</li>
</ul>
<blockquote>
<p>如果不使用箭头函数，就得考虑 this 绑定问题，还有事件对象<code>event</code></p>
</blockquote>
<pre class="shiki andromeeda" style="background-color:#23262E;color:#D5CED9" tabindex="0"><code class="language-js"><span class="line"><span style="color:#C74DED">function</span><span style="color:#FFE66D"> debounce</span><span style="color:#D5CED9">(</span><span style="color:#00E8C6">func</span><span style="color:#D5CED9">, </span><span style="color:#00E8C6">wait</span><span style="color:#D5CED9">) {</span></span>
<span class="line"><span style="color:#C74DED">  let</span><span style="color:#00E8C6"> timeout</span><span style="color:#D5CED9">;</span></span>
<span class="line"><span style="color:#C74DED">  let</span><span style="color:#00E8C6"> _self</span><span style="color:#EE5D43"> =</span><span style="color:#FF00AA"> this</span><span style="color:#D5CED9">;</span></span>
<span class="line"><span style="color:#C74DED">  return</span><span style="color:#C74DED"> function</span><span style="color:#D5CED9"> (</span><span style="color:#00E8C6">e</span><span style="color:#D5CED9">) {</span></span>
<span class="line"><span style="color:#FFE66D">    clearTimeout</span><span style="color:#D5CED9">(</span><span style="color:#00E8C6">timeout</span><span style="color:#D5CED9">);</span></span>
<span class="line"><span style="color:#00E8C6">    timeout</span><span style="color:#EE5D43"> =</span><span style="color:#FFE66D"> setTimeout</span><span style="color:#D5CED9">(</span><span style="color:#C74DED">function</span><span style="color:#D5CED9"> () {</span></span>
<span class="line"><span style="color:#F39C12">      Reflect</span><span style="color:#D5CED9">.</span><span style="color:#FFE66D">apply</span><span style="color:#D5CED9">(</span><span style="color:#00E8C6">func</span><span style="color:#D5CED9">, </span><span style="color:#00E8C6">_self</span><span style="color:#D5CED9">, </span><span style="color:#00E8C6">e</span><span style="color:#D5CED9">);</span></span>
<span class="line"><span style="color:#D5CED9">    }, </span><span style="color:#00E8C6">wait</span><span style="color:#D5CED9">);</span></span>
<span class="line"><span style="color:#D5CED9">  };</span></span>
<span class="line"><span style="color:#D5CED9">}</span></span>
<span class="line"></span></code></pre>
<h3 id="立即执行">立即执行<a class="anchor" aria-label="Anchor" aria-hidden="true" data-anchorjs-icon="🔗" href="#立即执行"></a></h3>
<blockquote>
<p>如果希望事件每次重新点击都会立刻执行，然后等到停止触发 n 秒后，才可以重新触发。而不是非要等到事件停止触发后才执行</p>
</blockquote>
<pre class="shiki andromeeda" style="background-color:#23262E;color:#D5CED9" tabindex="0"><code class="language-js"><span class="line"><span style="color:#C74DED">function</span><span style="color:#FFE66D"> debounce</span><span style="color:#D5CED9">(</span><span style="color:#00E8C6">func</span><span style="color:#D5CED9">, </span><span style="color:#00E8C6">wait</span><span style="color:#D5CED9">, </span><span style="color:#00E8C6">immediate</span><span style="color:#D5CED9">) {</span></span>
<span class="line"><span style="color:#C74DED">  let</span><span style="color:#00E8C6"> timeout</span><span style="color:#D5CED9">;</span></span>
<span class="line"><span style="color:#C74DED">  return</span><span style="color:#C74DED"> function</span><span style="color:#D5CED9"> (</span><span style="color:#00E8C6">e</span><span style="color:#D5CED9">) {</span></span>
<span class="line"><span style="color:#A0A1A7CC">    //timeout 为 false 才会立即执行</span></span>
<span class="line"><span style="color:#C74DED">    let</span><span style="color:#00E8C6"> hasImmediate</span><span style="color:#EE5D43"> =</span><span style="color:#EE5D43"> !</span><span style="color:#00E8C6">timeout</span><span style="color:#EE5D43"> &#x26;&#x26;</span><span style="color:#00E8C6"> immediate</span><span style="color:#D5CED9">;</span></span>
<span class="line"><span style="color:#C74DED">    if</span><span style="color:#D5CED9"> (</span><span style="color:#00E8C6">timeout</span><span style="color:#D5CED9">) </span><span style="color:#FFE66D">clearTimeout</span><span style="color:#D5CED9">(</span><span style="color:#00E8C6">timeout</span><span style="color:#D5CED9">);</span></span>
<span class="line"><span style="color:#00E8C6">    timeout</span><span style="color:#EE5D43"> =</span><span style="color:#FFE66D"> setTimeout</span><span style="color:#D5CED9">(() </span><span style="color:#C74DED">=></span><span style="color:#D5CED9"> {</span></span>
<span class="line"><span style="color:#A0A1A7CC">      //执行完定时器之后也会立即执行</span></span>
<span class="line"><span style="color:#00E8C6">      timeout</span><span style="color:#EE5D43"> =</span><span style="color:#EE5D43"> null</span><span style="color:#D5CED9">;</span></span>
<span class="line"><span style="color:#D5CED9">    }, </span><span style="color:#00E8C6">wait</span><span style="color:#D5CED9">);</span></span>
<span class="line"><span style="color:#C74DED">    if</span><span style="color:#D5CED9"> (</span><span style="color:#00E8C6">hasImmediate</span><span style="color:#D5CED9">) {</span></span>
<span class="line"><span style="color:#FFE66D">      func</span><span style="color:#D5CED9">(</span><span style="color:#00E8C6">e</span><span style="color:#D5CED9">);</span></span>
<span class="line"><span style="color:#D5CED9">    }</span></span>
<span class="line"><span style="color:#D5CED9">  };</span></span>
<span class="line"><span style="color:#D5CED9">}</span></span>
<span class="line"></span></code></pre>
<ul class="remark-unordered-list">
<li>两种立即执行的情况
<ul class="remark-ordered-list">
<li>当开始滑动时，再次触发事件，事件会立即执行</li>

<span class="line"><span style="color:#FFE66D">      func</span><span style="color:#D5CED9">();</span></span>
<span class="line"><span style="color:#D5CED9">    } </span><span style="color:#C74DED">else</span><span style="color:#C74DED"> if</span><span style="color:#D5CED9"> (</span><span style="color:#EE5D43">!</span><span style="color:#00E8C6">timeout</span><span style="color:#EE5D43"> &#x26;&#x26;</span><span style="color:#F39C12"> options</span><span style="color:#D5CED9">.</span><span style="color:#00E8C6">trailing</span><span style="color:#EE5D43"> ===</span><span style="color:#EE5D43"> true</span><span style="color:#D5CED9">) {</span></span>
<span class="line"><span style="color:#00E8C6">      timeout</span><span style="color:#EE5D43"> =</span><span style="color:#FFE66D"> setTimeout</span><span style="color:#D5CED9">(</span><span style="color:#00E8C6">later</span><span style="color:#D5CED9">, </span><span style="color:#00E8C6">remaining</span><span style="color:#D5CED9">);</span></span>
<span class="line"><span style="color:#D5CED9">    }</span></span>
<span class="line"><span style="color:#D5CED9">  }</span></span>
<span class="line"><span style="color:#C74DED">  return</span><span style="color:#00E8C6"> throttled</span><span style="color:#D5CED9">;</span></span>
<span class="line"><span style="color:#D5CED9">}</span></span>
<span class="line"></span></code></pre>
<ul class="remark-ordered-list">
<li>为什么会有 <code>!timeout</code>,当触发的时间小于等待的时间的时候会执行，并且因为是定时器会在一段时间后再执行（并且不断的触发定时器都会重新执行，直到 <code>remaining&#x3C;=0</code>）</li>
<li><code>remaining &#x3C;= 0 || remaining > wait</code>：小于等待时间，或者时间超过了等待时间（previous 只有在 if...内部会更新。第一次触发后只有 now 会不停更新）</li>
</ul>
<h3 id="throttled-取消">throttled 取消<a class="anchor" aria-label="Anchor" aria-hidden="true" data-anchorjs-icon="🔗" href="#throttled-取消"></a></h3>
<pre class="shiki andromeeda" style="background-color:#23262E;color:#D5CED9" tabindex="0"><code class="language-js"><span class="line"><span style="color:#F39C12">throttled</span><span style="color:#D5CED9">.</span><span style="color:#FFE66D">cancel</span><span style="color:#EE5D43"> =</span><span style="color:#C74DED"> function</span><span style="color:#D5CED9"> () {</span></span>
<span class="line"><span style="color:#FFE66D">  clearTimeout</span><span style="color:#D5CED9">(</span><span style="color:#00E8C6">timeout</span><span style="color:#D5CED9">);</span></span>
<span class="line"><span style="color:#00E8C6">  timeout</span><span style="color:#EE5D43"> =</span><span style="color:#EE5D43"> null</span><span style="color:#D5CED9">;</span></span>
<span class="line"><span style="color:#00E8C6">  previous</span><span style="color:#EE5D43"> =</span><span style="color:#F39C12"> 0</span><span style="color:#D5CED9">;</span></span>
<span class="line"><span style="color:#D5CED9">};</span></span>
