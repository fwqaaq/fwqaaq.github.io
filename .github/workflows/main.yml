name: Deploy Worker

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts

      - name: Build dist + generate worker content
        run: deno task build

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker deps
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Check Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)

          if echo "$CLOUDFLARE_API_TOKEN" | grep -qi '^Bearer '; then
            echo "CLOUDFLARE_API_TOKEN should be token only, do not include 'Bearer '"
            exit 1
          fi

          if echo "$CLOUDFLARE_API_TOKEN" | grep -q 'CLOUDFLARE_API_TOKEN='; then
            echo "CLOUDFLARE_API_TOKEN should be token only, do not include variable name"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
