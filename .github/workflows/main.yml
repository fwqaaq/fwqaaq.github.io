name: Deploy to gh-pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Deploys the static site + x402 content API to Cloudflare Workers.
  # No-ops until CLOUDFLARE_API_TOKEN is configured, so it never breaks CI.
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts
      - name: Build dist + generate worker content
        run: deno task build
      - name: Set Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install worker deps
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
